<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
  <rect width="880" height="330" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#777"/></marker></defs>
  <rect x="340" y="14" width="200" height="40" rx="8" fill="#FFF3DD" stroke="#C98A1B" stroke-width="2"/>
  <text x="440" y="39" text-anchor="middle" font-weight="600">WindowPosture</text>
  <g stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M370 54 L120 100"/><path d="M420 54 L330 100"/><path d="M470 54 L560 100"/><path d="M520 54 L770 100"/>
  </g>
  <g fill="#E6F2F4" stroke="#2E6B76" stroke-width="2">
    <rect x="30" y="100" width="180" height="70" rx="8"/><rect x="240" y="100" width="180" height="70" rx="8"/>
    <rect x="470" y="100" width="180" height="70" rx="8"/><rect x="680" y="100" width="180" height="70" rx="8"/>
  </g>
  <text x="120" y="126" text-anchor="middle" font-weight="600">Cover · Tabletop</text><text x="120" y="148" text-anchor="middle">own surface</text>
  <text x="330" y="126" text-anchor="middle" font-weight="600">Book · Tri-fold</text><text x="330" y="148" text-anchor="middle">panes = hinge segments</text>
  <text x="560" y="126" text-anchor="middle" font-weight="600">Flat, height compact</text><text x="560" y="148" text-anchor="middle">one pane (phone landscape)</text>
  <text x="770" y="126" text-anchor="middle" font-weight="600">Flat</text><text x="770" y="148" text-anchor="middle">by width, see below</text>
  <g fill="#F4F4F4" stroke="#999" stroke-width="1.5">
    <rect x="240" y="210" width="190" height="62" rx="8"/><rect x="455" y="210" width="190" height="62" rx="8"/><rect x="670" y="210" width="190" height="62" rx="8"/>
  </g>
  <text x="335" y="234" text-anchor="middle" font-weight="600">≥ 1200 (Large)</text><text x="335" y="256" text-anchor="middle">list 28% · detail · history 360</text>
  <text x="550" y="234" text-anchor="middle" font-weight="600">room for two</text><text x="550" y="256" text-anchor="middle">list 40% (360–480) · detail</text>
  <text x="765" y="234" text-anchor="middle" font-weight="600">otherwise</text><text x="765" y="256" text-anchor="middle">one pane</text>
  <g stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M740 170 L340 206"/><path d="M760 170 L555 206"/><path d="M770 170 L765 206"/>
  </g>
  <text x="440" y="310" text-anchor="middle" fill="#C0392B" font-weight="600">Every branch: a pane narrower than 360 collapses the layout to fewer panes.</text>
</svg>
